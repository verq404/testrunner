name: Daily commits

on:
  schedule:
    - cron: "17 9 * * *"   # täglich 09:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Git-Identität setzen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OWNER="${{ github.repository_owner }}"
          ID=$(gh api "users/$OWNER" --jq .id)
          git config user.name  "$OWNER"
          git config user.email "${ID}+${OWNER}@users.noreply.github.com"

      - name: Commits erstellen
        run: |
          MIN=2; MAX=35
          COUNT=$(( MIN + RANDOM % (MAX - MIN + 1) ))
          WORDS=(update tweak refactor cleanup notes log tidy adjust polish sync)
          mkdir -p logs
          FILE="logs/$(date -u +%Y-%m).md"
          for i in $(seq 1 "$COUNT"); do
            w=${WORDS[$RANDOM % ${#WORDS[@]}]}
            echo "- $(date -u '+%F %T') $w #$i $RANDOM$RANDOM" >> "$FILE"
            git add "$FILE"
            git commit -q -m "$w: entry $i ($(date -u +%F))"
          done
          echo "$COUNT Commits erstellt."

      - name: Pushen
        run: git push
